[project]
name = "mandate-copilot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "pandas>=3.0.5",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "pytest>=9.1.1",
    "requests>=2.34.2",
    "streamlit>=1.63.0",
    "uvicorn>=0.52.4",
]

[project.scripts]
mandate-copilot = "mandate_copilot:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"
